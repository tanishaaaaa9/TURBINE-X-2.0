# TURBINE-X Model Hyperparameters Configuration
baselines:
  Dummy_mean:
    strategy: "mean"
  Dummy_median:
    strategy: "median"
  LinearRegression:
    fit_intercept: true

linear_models:
  Ridge:
    alpha: 1.0
    random_state: 42
  Lasso:
    alpha: 0.01
    max_iter: 10000
    random_state: 42
  ElasticNet:
    alpha: 0.01
    l1_ratio: 0.5
    max_iter: 10000
    random_state: 42

tree_models:
  DecisionTree:
    max_depth: 12
    min_samples_leaf: 5
    random_state: 42
  RandomForest:
    n_estimators: 250
    min_samples_leaf: 2
    max_features: 0.8
    n_jobs: -1
    random_state: 42
  ExtraTrees:
    n_estimators: 250
    min_samples_leaf: 2
    max_features: 0.8
    n_jobs: -1
    random_state: 42
  HistGradientBoosting:
    max_iter: 250
    learning_rate: 0.06
    l2_regularization: 1.0
    random_state: 42

boosting_models:
  XGBoost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1
    random_state: 42
  CatBoost:
    iterations: 300
    learning_rate: 0.06
    depth: 6
    random_state: 42
    allow_writing_files: false

