project_name: TURBINE-X
version: 1.0.0
random_seed: 42
dataset:
  source: UCI Gas Turbine CO and NOx Emission Data Set
  doi: 10.24432/C5WC95
  files:
  - gt_2011.csv
  - gt_2012.csv
  - gt_2013.csv
  - gt_2014.csv
  - gt_2015.csv
  expected_rows: 36733
  columns:
  - AT
  - AP
  - AH
  - AFDP
  - GTEP
  - TIT
  - TAT
  - TEY
  - CDP
  - CO
  - NOX
experiments:
  A_emission_benchmark:
    features:
    - AT
    - AP
    - AH
    - AFDP
    - GTEP
    - TIT
    - TAT
    - TEY
    - CDP
    targets:
    - CO
    - NOX
    purpose: Comparability with existing emission-prediction work; not the novelty
      claim
  B_joint_outputs:
    features:
    - AT
    - AP
    - AH
    - AFDP
    - GTEP
    - TIT
    - TAT
    - CDP
    targets:
    - CO
    - NOX
    - TEY
    purpose: Primary investigation of joint emission-energy multi-output learning
split:
  development_years:
  - 2011
  - 2012
  - 2013
  calibration_year: 2014
  locked_test_year: 2015
  within_development_folds:
  - train:
    - 2011
    validation:
    - 2012
  - train:
    - 2011
    - 2012
    validation:
    - 2013
constraints:
  deep_learning: false
  no_timestamp_inference: true
  no_causal_claims: true
  test_used_once: true
