<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A"/>
      <stop offset="50%" stop-color="#07172C"/>
      <stop offset="100%" stop-color="#0B1E38"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bannerBg)" stroke="#16385C" stroke-width="2"/>

  <!-- Technical Grid Pattern -->
  <g stroke="url(#gridGrad)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="420"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="260" y1="0" x2="260" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="460" y1="0" x2="460" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="660" y1="0" x2="660" y2="420"/>
    <line x1="760" y1="0" x2="760" y2="420"/>
    <line x1="860" y1="0" x2="860" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1060" y1="0" x2="1060" y2="420"/>
    <line x1="1160" y1="0" x2="1160" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Ambient Ambient Glow Concentrators -->
  <circle cx="1020" cy="210" r="160" fill="#00FFFF" opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="180" cy="120" r="120" fill="#0077B6" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Left Side: Decorative Corner Marker -->
  <path d="M 40,60 L 40,40 L 60,40" stroke="#00FFFF" stroke-width="3" fill="none"/>
  <path d="M 1160,60 L 1160,40 L 1140,40" stroke="#00FFFF" stroke-width="3" fill="none"/>
  <path d="M 40,360 L 40,380 L 60,380" stroke="#00FFFF" stroke-width="3" fill="none"/>
  <path d="M 1160,360 L 1160,380 L 1140,380" stroke="#00FFFF" stroke-width="3" fill="none"/>

  <!-- System Badge Top Left -->
  <rect x="70" y="55" width="230" height="30" rx="15" fill="#07172C" stroke="#00FFFF" stroke-width="1.2"/>
  <circle cx="86" cy="70" r="4.5" fill="#00FFFF" filter="url(#cyanGlow)"/>
  <text x="100" y="75" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#90E0EF" letter-spacing="1.5">INDUSTRIAL AI PLATFORM</text>

  <!-- Main Hero Titles -->
  <text x="70" y="155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1">TURBINE-X <tspan fill="#00FFFF" filter="url(#cyanGlow)">2.0</tspan></text>
  <text x="70" y="200" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="600" fill="#00FFFF" letter-spacing="0.5">An Intelligent Multi-Task AI Platform for Gas Turbine Analytics</text>

  <!-- Description paragraph -->
  <text x="70" y="240" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14" font-weight="400" fill="#C5D3E8">
    Gas Turbine Emission Prediction (CO &amp; NOx) • Operational Risk Classification • Unsupervised Health
  </text>
  <text x="70" y="264" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14" font-weight="400" fill="#8FA4C4">
    Sequential Observation Forecasting • SHAP Interpretability • Conformal Uncertainty Estimation
  </text>

  <!-- Pills / Tech Features at Bottom -->
  <g transform="translate(70, 310)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#0E223D" stroke="#00FFFF" stroke-width="1.2"/>
    <text x="65" y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#00FFFF" text-anchor="middle">16 Regressors</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="135" height="34" rx="17" fill="#0E223D" stroke="#0077B6" stroke-width="1.2"/>
    <text x="212" y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#90E0EF" text-anchor="middle">14 Classifiers</text>

    <!-- Pill 3 -->
    <rect x="295" y="0" width="155" height="34" rx="17" fill="#0E223D" stroke="#0077B6" stroke-width="1.2"/>
    <text x="372" y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#90E0EF" text-anchor="middle">5 Anomaly Detectors</text>

    <!-- Pill 4 -->
    <rect x="465" y="0" width="145" height="34" rx="17" fill="#0E223D" stroke="#0077B6" stroke-width="1.2"/>
    <text x="537" y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#90E0EF" text-anchor="middle">36 Figures (300 DPI)</text>

    <!-- Pill 5 -->
    <rect x="625" y="0" width="155" height="34" rx="17" fill="#0E223D" stroke="#00FFFF" stroke-width="1.2"/>
    <text x="702" y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#00FFFF" text-anchor="middle">Streamlit Dashboard</text>
  </g>

  <!-- Right Side: Majestic Turbine Impeller Geometry -->
  <g transform="translate(1010, 210)">
    <!-- Outer concentric rings -->
    <circle r="145" fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
    <circle r="130" fill="none" stroke="#0077B6" stroke-width="2" stroke-dasharray="16 12" opacity="0.6"/>
    <circle r="115" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.3"/>
    <circle r="95" fill="none" stroke="#1E3E62" stroke-width="3"/>

    <!-- 12 Aerodynamic Impeller Blades -->
    <g id="blades">
      <!-- Blade 0 -->
      <path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="1" filter="url(#cyanGlow)"/>
      <!-- Blade 30 -->
      <g transform="rotate(30)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 60 -->
      <g transform="rotate(60)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 90 -->
      <g transform="rotate(90)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 120 -->
      <g transform="rotate(120)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 150 -->
      <g transform="rotate(150)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 180 -->
      <g transform="rotate(180)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 210 -->
      <g transform="rotate(210)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 240 -->
      <g transform="rotate(240)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 270 -->
      <g transform="rotate(270)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 300 -->
      <g transform="rotate(300)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
      <!-- Blade 330 -->
      <g transform="rotate(330)"><path d="M 0,-32 C 32,-48 48,-92 34,-112 C 24,-115 10,-98 -12,-72 Z" fill="url(#bladeGrad)" stroke="#00FFFF" stroke-width="0.8"/></g>
    </g>

    <!-- Center Hub Rotor Core -->
    <circle r="36" fill="#040D1A" stroke="#00FFFF" stroke-width="3" filter="url(#cyanGlow)"/>
    <circle r="20" fill="#0077B6" opacity="0.6"/>
    <circle r="10" fill="#00FFFF"/>
    <!-- Cardinal Crosshairs -->
    <line x1="-48" y1="0" x2="-36" y2="0" stroke="#00FFFF" stroke-width="2"/>
    <line x1="36" y1="0" x2="48" y2="0" stroke="#00FFFF" stroke-width="2"/>
    <line x1="0" y1="-48" x2="0" y2="-36" stroke="#00FFFF" stroke-width="2"/>
    <line x1="0" y1="36" x2="0" y2="48" stroke="#00FFFF" stroke-width="2"/>
  </g>
</svg>
