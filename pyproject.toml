[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbine-x"
version = "2.0.0"
description = "An Intelligent Multi-Task AI Platform for Gas Turbine Performance and Emission Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tanisha Prasad", email = "tanishaaaaa9@users.noreply.github.com" }
]
keywords = [
    "gas-turbine",
    "emission-prediction",
    "machine-learning",
    "multi-task-learning",
    "anomaly-detection",
    "explainable-ai",
    "shap",
    "streamlit"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.31.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0.0",
    "fastparquet>=2023.10.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[project.urls]
Homepage = "https://github.com/tanishaaaaa9/TURBINE-X-2.0"
Repository = "https://github.com/tanishaaaaa9/TURBINE-X-2.0.git"
Documentation = "https://github.com/tanishaaaaa9/TURBINE-X-2.0#readme"
Tracker = "https://github.com/tanishaaaaa9/TURBINE-X-2.0/issues"

